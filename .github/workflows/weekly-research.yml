# Weekly AI-coding security research with any AI model that has an
# OpenAI-compatible API. Set these in Settings > Secrets and variables > Actions:
#   Variables: AI_BASE_URL, AI_MODEL
#   Secret:    AI_API_KEY
# If they are not set, the job does nothing. The report is opened as an issue.
name: Weekly security research

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_BASE_URL: ${{ vars.AI_BASE_URL }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
    steps:
      - name: Check settings
        id: check
        run: |
          if [ -z "$AI_BASE_URL" ] || [ -z "$AI_MODEL" ]; then
            echo "::notice::Weekly research is not set up (AI_BASE_URL / AI_MODEL variables are empty). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.check.outputs.ready == 'true'
        with:
          persist-credentials: false

      - name: Run research
        if: steps.check.outputs.ready == 'true'
        run: echo "REPORT=$(scripts/weekly-research.sh)" >> "$GITHUB_ENV"

      - name: Open issue with the report
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "AI-coding security research: $(date -u +%Y-%m-%d)" \
            --body-file "$REPORT"
